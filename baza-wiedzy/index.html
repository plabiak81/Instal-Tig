    });
    $("grid").innerHTML = list.length ? list.map(function (a) {
      return '<button class="card" type="button" data-id="' + a.id + '"><span class="cat">' + a.catL + "</span><h2>" + esc(a.title) + "</h2><p>" + esc(a.sum) + '</p><span class="tags">' +
        a.tags.slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</span></button>";
    }).join("") : '<div class="empty" style="grid-column:1/-1">Brak artykułów dla tego zapytania. Zmień słowo kluczowe albo wybierz kategorię „Wszystkie”.</div>';
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-cat") === cat); });
  }

  function openArticle(id) {
    var a = A.filter(function (x) { return x.id === id; })[0];
    $("articleView").innerHTML = '<article class="article"><button class="back" type="button" id="back">← Wszystkie artykuły</button>' +
      '<div class="cat">' + a.catL + "</div><h2>" + esc(a.title) + '</h2><p class="sum">' + esc(a.sum) + "</p>" +
      a.s.map(function (s) { return "<h3>" + esc(s[0]) + '</h3><p class="body">' + esc(s[1]) + "</p>"; }).join("") +
      '<div class="norms"><span>Normy i odniesienia:</span>' + a.norms.map(function (n) { return '<span class="tag">' + esc(n) + "</span>"; }).join("") + "</div></article>";
    $("listView").hidden = true; $("articleView").hidden = false;
    $("back").addEventListener("click", closeArticle);
    window.scrollTo(0, 0);
  }
  function closeArticle() { $("articleView").hidden = true; $("listView").hidden = false; window.scrollTo(0, 0); }

  $("q").addEventListener("input", function (e) { q = e.target.value.trim(); renderList(); });
  $("chips").addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (b) { cat = b.getAttribute("data-cat"); renderList(); } });
  $("grid").addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) openArticle(parseInt(c.getAttribute("data-id"), 10)); });
  renderList();
})();
</script>

</body>
</html>
