<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Baza wiedzy Instal-TIG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;600&display=swap">
<style>
  :root { --bg:#EDF1F4; --surface:#FFFFFF; --ink:#14212B; --muted:#596A76; --line:#D2DAE0; --accent:#0E6A88; --accent-ink:#FFFFFF; --field:#F6F8FA; --err:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0D161D; --surface:#15222C; --ink:#E3EBF0; --muted:#8DA2AF; --line:#263A49; --accent:#5BB8D6; --accent-ink:#0D161D; --field:#0F1A22; --err:#FF8A80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:15px/1.5 "Public Sans","Segoe UI",Arial,sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:24px; }
  .eyebrow { font:600 12px/1 "Public Sans",sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  h1 { font:700 28px/1.1 "Barlow Semi Condensed","Arial Narrow",sans-serif; margin:8px 0 6px; }
  p { margin:0 0 16px; color:var(--muted); }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  input { width:100%; font:inherit; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:5px; padding:10px 12px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { margin-top:12px; width:100%; font:600 15px "Public Sans",sans-serif; background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px; padding:11px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { min-height:20px; margin-top:10px; font-size:13px; color:var(--err); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Instal-TIG</div>
  <h1>Baza wiedzy</h1>
  <p>Dostęp tylko dla osób z hasłem. Wpisz hasło, żeby odblokować artykuły.</p>
  <form id="f">
    <label for="pw">Hasło</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Odblokuj</button>
    <div id="err" role="alert"></div>
  </form>
</main>
